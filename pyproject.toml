[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apexbet"
version = "0.1.0"
description = "ApexBet: a local AWS-simulated real-time gambling data platform (synthetic data only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ApexBet Data Platform" }]
keywords = ["data-engineering", "streaming", "kinesis", "kafka", "spark", "airflow", "sportsbook"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "fastapi>=0.110,<0.116",
  "starlette>=0.37,<0.42",
  "uvicorn[standard]>=0.29,<1",
  "httpx>=0.27,<0.28",
  "prometheus-client>=0.20,<1",
  "duckdb>=1.0,<2",
  "pyarrow>=16,<20",
  "pandas>=2.2,<3",
  "python-dateutil>=2.9,<3",
  "boto3>=1.34,<2",
  "confluent-kafka>=2.3,<3",
  "tenacity>=8.2,<10",
  "structlog>=24.1,<26",
  "scikit-learn>=1.4,<2",
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4", "pyiceberg>=0.6,<1"]
infra = ["python-hcl2>=4.3,<8"]
dev = [
  "pytest>=8.1,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
  "mypy>=1.10,<2",
  "types-jsonschema>=4.21",
  "types-python-dateutil>=2.9",
  "pandera>=0.19,<1",
  "types-requests",
  "freezegun>=1.5,<2",
]

[project.scripts]
apexbet = "apexbet.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apexbet"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
# E501: line length is handled by the formatter.
# B008: typer/Depends call-in-default is idiomatic.
# UP042: str+Enum mixin is intentional for Pydantic v2 value semantics.
ignore = ["E501", "B008", "RUF012", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = "(^dags/|^src/apexbet/spark/)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests that require running local infrastructure (Docker services)",
  "aws: tests that require LocalStack or real AWS",
  "slow: long-running tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/apexbet"]
omit = ["*/cli/*"]
