global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: apexbet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: ingestion-api

  # Redpanda exposes Prometheus metrics on :9644/metrics
  - job_name: redpanda
    metrics_path: /metrics
    static_configs:
      - targets: ["redpanda:9644"]
        labels:
          component: redpanda

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
